# @package _global_
# Phase 2 / step 3: learn the entity taxonomy and assign READ SIDs (RSIDs). WRITE is skipped
# here because no gameplay exists yet (gotcha #11). Run:
#   python -m rimworld_agent.semantic_ids.assign_ids experiment=semantic_ids
#   python -m rimworld_agent.semantic_ids.visualize  experiment=semantic_ids

semantic_ids:
  enabled: true
  use_csharp_view: true
  write:
    enabled: false
  read:
    contrastive_strength: 0.3
    rqvae:
      levels: 3
      codebook_size: 64
      train_steps: 4000
